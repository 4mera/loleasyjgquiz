<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>index</title>
<style>
:root{
  --bg:#0f1621;
  --panel:#1a2433;
  --panel-raised:#212d3f;
  --line:#2b374a;
  --gold:#5383e8;
  --gold-dim:#3d5fa8;
  --text:#eef1f6;
  --text-dim:#8291a6;
  --ok:#3dd598;
  --ng:#ef4a67;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  height:100%;
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Hiragino Sans","Noto Sans JP",-apple-system,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.topbar{
  width:100%;
  background:#0b121c;
  border-bottom:2px solid var(--gold);
  display:flex;
  justify-content:center;
}
.topbar-inner{
  width:100%;
  max-width:560px;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:8px;
}
.topbar-badge{
  width:22px;
  height:22px;
  border-radius:5px;
  background:var(--gold);
  color:#0b121c;
  font-size:12px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
}
.topbar-text{
  font-size:13px;
  font-weight:700;
  letter-spacing:.02em;
  color:var(--text);
}
.topbar-text span{
  color:var(--text-dim);
  font-weight:500;
}
.wrap{
  width:100%;
  max-width:560px;
  padding:24px 20px 48px;
}
.head{
  margin-bottom:20px;
}
.eyebrow{
  color:var(--gold);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
  margin-bottom:6px;
}
h1{
  font-size:23px;
  margin:0 0 4px;
  font-weight:800;
  letter-spacing:-.01em;
}
.sub{
  color:var(--text-dim);
  font-size:13.5px;
  margin:0;
}
.progress-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:16px 0 20px;
}
.progress-track{
  flex:1;
  height:6px;
  background:var(--panel-raised);
  border-radius:3px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg, var(--gold-dim), var(--gold));
  width:0%;
  transition:width .3s ease;
}
.progress-label{
  font-size:12.5px;
  font-weight:700;
  color:var(--text-dim);
  white-space:nowrap;
  background:var(--panel-raised);
  padding:3px 9px;
  border-radius:5px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  padding:22px 20px;
}
.q-tag{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  color:var(--gold);
  background:rgba(83,131,232,0.12);
  border:1px solid rgba(83,131,232,0.35);
  padding:3px 9px;
  border-radius:4px;
  margin-bottom:12px;
}
.q-text{
  font-size:16px;
  line-height:1.6;
  margin:0 0 20px;
  font-weight:600;
}
.options{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.opt{
  text-align:left;
  background:var(--panel-raised);
  border:1px solid var(--line);
  color:var(--text);
  padding:12px 14px;
  border-radius:6px;
  font-size:14.5px;
  line-height:1.5;
  cursor:pointer;
  transition:border-color .15s ease, background .15s ease;
}
.opt:active{transform:scale(0.995);}
.opt:not(:disabled):hover{
  border-color:var(--gold);
}
.opt.correct{
  border-color:var(--ok);
  background:rgba(61,213,152,0.1);
}
.opt.wrong{
  border-color:var(--ng);
  background:rgba(239,74,103,0.1);
}
.opt:disabled{cursor:default;}
.explain{
  margin-top:18px;
  padding:14px 16px;
  background:var(--panel-raised);
  border-left:3px solid var(--gold);
  border-radius:4px;
  font-size:13.5px;
  line-height:1.7;
  color:var(--text-dim);
  display:none;
}
.explain.show{display:block;}
.explain b{color:var(--text);}
.next-row{
  margin-top:18px;
  display:none;
}
.next-row.show{display:block;}
.next-btn{
  width:100%;
  background:var(--gold);
  color:#0b121c;
  border:none;
  padding:13px;
  border-radius:6px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}
.result{
  text-align:center;
  padding:30px 6px 10px;
}
.tier-badge{
  width:72px;
  height:72px;
  margin:0 auto 14px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  font-weight:800;
  border:3px solid var(--gold);
  color:var(--gold);
  background:var(--panel-raised);
}
.result .score{
  font-size:36px;
  font-weight:800;
  color:var(--text);
  margin:0 0 2px;
}
.result .score-sub{
  color:var(--text-dim);
  font-size:13px;
  margin-bottom:18px;
}
.result p{
  font-size:14px;
  line-height:1.7;
  color:var(--text-dim);
}
.weak-head{
  text-align:left;
  font-size:11px;
  font-weight:700;
  letter-spacing:.03em;
  color:var(--text-dim);
  margin:22px 0 10px;
  padding-top:16px;
  border-top:1px solid var(--line);
}
.weak-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.weak-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--panel-raised);
  border:1px solid var(--line);
  border-radius:6px;
  padding:10px 14px;
  font-size:13.5px;
  text-align:left;
}
.weak-count{
  color:var(--ng);
  font-weight:800;
  font-size:12.5px;
}
.weak-ok{
  color:var(--ok);
  font-size:14px;
  text-align:left;
  margin-top:0;
}
.retry-btn{
  margin-top:22px;
  background:transparent;
  border:1px solid var(--gold-dim);
  color:var(--gold);
  padding:11px 20px;
  border-radius:6px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-badge">JG</div>
    <div class="topbar-text">QIYANA <span>/ Jungle Basics</span></div>
  </div>
</div>
<div class="wrap">
  <div class="head">
    <div class="eyebrow">キヤナ ジャングル</div>
    <h1>基礎知識テスト</h1>
    <p class="sub">状況判断を鍛える実戦問題です</p>
  </div>
  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="pfill"></div></div>
    <div class="progress-label" id="plabel">1 / 12</div>
  </div>
  <div class="card" id="card"></div>
</div>

<script>
const questions = [
  {
    tag: "ガンクの出し時",
    q: "敵レーナーのHPは半分以下、味方レーナーのHPはほぼ満タン。自分はそのレーナーに近い中立キャンプでちょうどレベル3になった。どうする？",
    options: [
      "すぐにガンクへ向かう",
      "そのままクリアを続ける",
      "敵ジャングルへインベードする",
      "ワードだけ置いてその場で様子を見る"
    ],
    correct: 0,
    explain: "敵HPが減っている、自分がレベル3でコンボが揃っている、位置的にすぐ動ける。<b>条件が揃っている時は動くべき場面</b>です。ここで動かないとチャンスを逃します。"
  },
  {
    tag: "フルクリア vs ガンク",
    q: "味方ミッドが敵に押されてタワー下に張り付いている。自分はレベル2、敵ジャングラーの位置は不明。どうする？",
    options: [
      "すぐにミッドへガンクに向かう",
      "敵ジャングラーの位置を探りながらクリアを続け、レベル3になってから動く",
      "味方の代わりに自分がウェーブを管理する",
      "敵ジャングルへインベードして仕留めに行く"
    ],
    correct: 1,
    explain: "押されているからといって、<b>レベル2・敵位置不明のまま飛び込むのは危険</b>です。タワー下の相手にはコンボも届きにくく、逆に自分が何もできず終わる可能性が高いです。敵の位置を探りつつレベル3まで整えてから動くほうが安全です。"
  },
  {
    tag: "リスク判断",
    q: "ガンクに向かったが、敵レーナーがEのスキル射程内に入らない距離にいる。敵のフラッシュは温存されたまま、味方レーナーにはCCスキルがない。どうする？",
    options: [
      "とりあえずEを打ってみる",
      "Qで間合いを詰めてからEのタイミングを計る",
      "無理に仕掛けず撤退し、別の場所へ向かう",
      "フラッシュで距離を詰めて仕掛ける"
    ],
    correct: 2,
    explain: "射程外からの強行はコンボが繋がらず、<b>CDとポジションを失うだけ</b>に終わります。さらに敵のフラッシュが残っていて味方にCCも無いため、仮に接近できても逃げられるリスクが高いです。無理に詰めるよりは一度引いて、別のタイミングか別のレーンを探すほうが損失が少なくなります。"
  },
  {
    tag: "カウンタージャングル",
    q: "ミニマップに敵ジャングラーの位置が表示されている（スキルやミニオンのアグロで見えている状態）。同時に、自分のレーンのウェーブが敵陣側に押し込まれていて、味方がいつでも合流しやすい。この状況で敵ジャングルへインベードする判断として正しいのは？",
    options: [
      "敵が見えているだけで十分なので即インベードする",
      "敵の位置が分かっている＋味方が合流しやすい、この2条件が揃っているので狙う価値がある",
      "ウェーブの状態に関係なく、敵が見えていれば常に行くべき",
      "敵が見えていてもインベードは常に避けるべき"
    ],
    correct: 1,
    explain: "キヤナはクリア速度でも1v1の強さでも突出していません。<b>敵の位置が分かっていること＋味方がすぐ合流できること</b>、この2条件が揃って初めてインベードの価値が出ます。片方だけでは成功率もリターンも不十分です。"
  },
  {
    tag: "オブジェクト判断",
    q: "ドラゴンの出現が近づいている。ボットレーンは互角、敵ジャングラーの位置は不明、まだ視界を置いていない。最初にすべきことは？",
    options: [
      "すぐにドラゴンへ向かいスマイトの準備をする",
      "ドラゴン周辺にコントロールワードを置く",
      "ボットレーンにもう一度ガンクに行く",
      "トップへ回ってサイドを管理する"
    ],
    correct: 1,
    explain: "コントロールワードは、<b>敵のポジションを把握するためだけでなく、自分たちがその場所を安全に確保するため</b>にも機能します。出現前に適所へ置くことで、奇襲を防ぎつつオブジェクト周辺の主導権を握れます。"
  },
  {
    tag: "キヤナ特有の判断",
    q: "ガンク先の近くに川がなく、壁のみがある。味方のレーナーにもCCスキルがない。このときの判断基準として正しいのは？",
    options: [
      "CCが無い時点で問答無用に撤退する",
      "自分のコンボのバーストダメージだけで倒しきれるか計算し、倒せそうなら仕掛け、無理そうなら撤退する",
      "岩エレメントがあれば十分CCの代わりになる",
      "水エレメントを取るために大きく迂回してから仕掛ける"
    ],
    correct: 1,
    explain: "岩エレメントに<b>CC効果はありません</b>(HPが減った敵への追加ダメージが役割)。重要なのはCCの有無そのものより、<b>自分のバーストだけで倒しきれるかどうか</b>の計算です。倒せる計算が立つなら仕掛ける価値があり、立たないなら無理に迂回や強行をせず撤退するのが安全です。"
  },
  {
    tag: "15分の目標設定",
    q: "「15分までに2キル」を目標にするとき、最も健全な捉え方はどれか？",
    options: [
      "キル数そのものを必達目標にし、条件が悪くても仕掛け続ける",
      "キル関与（アシスト含む）とレベル・ゴールド差を総合して見る",
      "キルが取れないなら視界やクリアは後回しでいい",
      "2キル取れなければその試合は失敗と考える"
    ],
    correct: 1,
    explain: "キル数だけを追うと<b>無理なガンクを誘発</b>します。アシストを含めたキル関与や、レベル・ゴールド差という結果指標で見るほうが、実際の試合展開と一致しやすいです。"
  },
  {
    tag: "レベル帯の判断",
    q: "レベル6に到達した直後、キヤナのジャングラーとして優先すべき行動は？",
    options: [
      "そのままクリアを継続し、レベル7を急ぐ",
      "ウルトが使える強みを活かし、ガンクやオブジェクトに絡みに行く",
      "トップサイドの視界だけを整える",
      "ショップに戻ってアイテムを揃えるまで待機する"
    ],
    correct: 1,
    explain: "レベル6はキヤナの<b>戦闘力が一段階上がるタイミング</b>です。ここでガンクやオブジェクトに絡まないと、せっかくの強い時間帯を無駄にしてしまいます。"
  },
  {
    tag: "ステルスの仕様",
    q: "草エレメントのステルスは、持続中に特定の行動をすると解除される。解除される行動として正しいのはどれか？",
    options: [
      "通常攻撃やW以外のスキルを使う",
      "ただ歩いて移動する",
      "近くの味方にピンを送る",
      "HPが減少する"
    ],
    correct: 0,
    explain: "草エレメントのステルスは、<b>通常攻撃や他のスキル(W以外)を使う、もしくは草原のエリア外に出る</b>と解除されます。移動やピンを送るだけでは解除されません。偵察や奇襲の接近で使う際は、無駄な操作で解除してしまわないよう注意が必要です。"
  },
  {
    tag: "ウルトの判断",
    q: "天賦絢爛(R)で敵をスタンさせた。フルコンボとして正しい流れはどれか？",
    options: [
      "R→すぐにリコールする",
      "R→AA→残っているスキル（Qなど）を畳みかけて確実に倒しきる",
      "R→スキルだけを連打し、AAは省略する",
      "R→スタン中は待機し、スタンが切れてから攻撃する"
    ],
    correct: 1,
    explain: "Rでスタンを取った直後は<b>AAを挟むことでパッシブの追加ダメージや打撃を稼ぎながら</b>、残りのスキルを畳みかけるのが基本です。AAを省略すると、スタン時間を活かしきれずダメージを落とします。"
  },
  {
    tag: "スマイトの使い方",
    q: "ガンクで追撃中、敵チャンピオンがわずかなHPで射程外へ逃げようとしている。強化済みのスマイト（おやつ20個以上消費済み）を持っている場合、どう使うべきか？",
    options: [
      "モンスターにしか効果がないので使わない",
      "逃げる敵チャンピオンに直接スマイトを打ち、確定ダメージとスロウでキルを確定させる",
      "次のキャンプ用に温存し、ガンクでは絶対に使わない",
      "味方チャンピオンに使って回復させる"
    ],
    correct: 1,
    explain: "現在のスマイトは、<b>おやつ20個以上で強化されると敵チャンピオンに確定ダメージとスロウ</b>を与えられます。ガンクで逃げられそうな場面はキルを確定させる好機です。ただしキャンプの確保やオブジェクト争いにも使う場面があるので、温存すべきかは状況次第です。"
  },
  {
    tag: "縦割りの判断",
    q: "縦割りルートを選ぶべき条件として正しいのはどれか？",
    options: [
      "育てたいサイドが明確で、かつ自分のジャングルマッチアップで有利が取れる場合",
      "どんな対面でも常に縦割りを選ぶべき",
      "味方のレベル1が弱くても気にせず敵陣スタートを選ぶ",
      "敵ジャングラーの動きに関係なく機械的に行う"
    ],
    correct: 0,
    explain: "縦割りは、<b>育てたいサイドが明確に決まっており、かつジャングルのマッチアップで有利が取れる場合</b>に選ぶ戦術です。味方のレベル1が強ければ敵陣スタート、自分のレベル3が相手より強ければ自陣スタート、というように条件分岐もあります。条件を満たさずに選ぶと、逆に自分のサイドだけ損をする展開になりやすいです。"
  }
];

let current = 0;
let score = 0;
let wrongTags = [];

function render(){
  const card = document.getElementById('card');
  const pfill = document.getElementById('pfill');
  const plabel = document.getElementById('plabel');

  if(current >= questions.length){
    pfill.style.width = '100%';
    plabel.textContent = questions.length + ' / ' + questions.length;

    const tagCounts = {};
    wrongTags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    const weakList = Object.entries(tagCounts).sort((a,b) => b[1]-a[1]);

    const weakHtml = weakList.length === 0
      ? '<p class="weak-ok">苦手なテーマは見当たりませんでした。</p>'
      : `<div class="weak-list">${weakList.map(([tag,count]) =>
          `<div class="weak-row"><span>${tag}</span><span class="weak-count">${count}問</span></div>`
        ).join('')}</div>`;

    const pct = score / questions.length;
    const tier = pct === 1 ? 'S' : pct >= 0.8 ? 'A' : pct >= 0.6 ? 'B' : 'C';

    card.innerHTML = `
      <div class="result">
        <div class="tier-badge">${tier}</div>
        <div class="score-sub">結果</div>
        <div class="score">${score} / ${questions.length}</div>
        <p>${score === questions.length
          ? '全問正解です。状況判断の基本は身についています。'
          : score >= questions.length * 0.6
          ? '基本の判断軸は掴めています。間違えた問題を見直してみてください。'
          : 'ガンク条件や視界の優先度を中心に、もう一度復習してみましょう。'}</p>
        <div class="weak-head">課題になりやすいテーマ</div>
        ${weakHtml}
        <button class="retry-btn" onclick="restart()">もう一度解く</button>
      </div>`;
    return;
  }

  const pct = Math.round((current / questions.length) * 100);
  pfill.style.width = pct + '%';
  plabel.textContent = (current + 1) + ' / ' + questions.length;

  const item = questions[current];
  card.innerHTML = `
    <div class="q-tag">${item.tag}</div>
    <p class="q-text">${item.q}</p>
    <div class="options" id="opts">
      ${item.options.map((o,i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}
    </div>
    <div class="explain" id="explain">${item.explain}</div>
    <div class="next-row" id="nextRow">
      <button class="next-btn" id="nextBtn">次の問題へ</button>
    </div>
  `;

  const optBtns = card.querySelectorAll('.opt');
  optBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      optBtns.forEach(b => b.disabled = true);
      const chosen = parseInt(btn.getAttribute('data-i'));
      if(chosen === item.correct){
        btn.classList.add('correct');
        score++;
      } else {
        btn.classList.add('wrong');
        optBtns[item.correct].classList.add('correct');
        wrongTags.push(item.tag);
      }
      document.getElementById('explain').classList.add('show');
      document.getElementById('nextRow').classList.add('show');
    });
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    current++;
    render();
  });
}

function restart(){
  current = 0;
  score = 0;
  wrongTags = [];
  render();
}

render();
</script>
</body>
</html>
